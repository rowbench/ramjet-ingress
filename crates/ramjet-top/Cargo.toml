[package]
name = "ramjet-top"
description = "A terminal cockpit for a running ramjet-ingress: routes, per-route rates, and the generation timeline, live."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ramjet-top"
path = "src/main.rs"

[lib]
name = "ramjet_top"
path = "src/lib.rs"

[dependencies]
# The terminal. `crossterm` is not a direct dependency on purpose: ratatui
# re-exports the exact version it was built against as `ratatui::crossterm`,
# and naming it twice is how a TUI ends up with two crossterm versions, one
# holding raw mode and the other trying to restore it.
#
# Default features off because the default set carries every backend ratatui
# knows and a calendar widget. `crossterm` is the backend; `layout-cache` is
# what keeps a per-frame `Layout::split` from re-running the constraint solver.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }

# The HTTP client is `hyper-util`'s legacy client over a plain `HttpConnector`,
# not `reqwest`. Three reasons, in order of how much they matter:
#
#   1. The workspace already builds all three of these crates for
#      `ramjet-proxy`, which uses the same client to reach upstreams. This
#      binary therefore adds no new transitive dependency to reach the admin
#      port — it compiles code that is already in the lockfile.
#   2. The admin endpoint is HTTP on loopback or a port-forward. `reqwest`
#      would link a second TLS stack to talk plaintext to 127.0.0.1, and this
#      workspace has one deliberate rustls configuration (`ring`, pinned at the
#      root) that it does not want a client quietly forking.
#   3. `ureq` would be the other lightweight answer, but it is blocking, and
#      the poll has to interleave with a terminal event loop. That is a thread
#      and a channel to re-invent what the runtime below already does.
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }

# Only `Bytes`, and only because the body types are written in terms of it.
bytes = "1.10"
http = "1.3"

serde = { workspace = true, features = ["derive"] }
# The admin API is JSON. This is the one crate in the workspace that reads it,
# and it is already in the lockfile.
serde_json = "1.0"
thiserror.workspace = true

# `rt-multi-thread` rather than `rt`: `terminal.draw` is a blocking write to a
# file descriptor, and it should not be able to stall an in-flight poll.
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
