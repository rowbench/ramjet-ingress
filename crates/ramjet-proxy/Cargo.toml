[package]
name = "ramjet-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ramjet-router.workspace = true
arc-swap.workspace = true

bytes = "1.10"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "server-graceful",
    "client",
    "client-legacy",
    "http1",
    "http2",
] }
pin-project-lite = "0.2"
socket2 = { version = "0.6", features = ["all"] }
# One event, on the connection-drop path when a PROXY header is rejected. The
# binary already links this through `ramjet-controller`, and a filtered-out
# event is an atomic load, so the alternative — dropping connections with no
# way to find out why — costs more than the dependency does.
tracing.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "macros",
] }

rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
rcgen.workspace = true
rustls-pemfile.workspace = true
