[package]
name = "ramjet-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ramjet-router.workspace = true
arc-swap.workspace = true

bytes = "1.10"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "server-graceful",
    "client",
    "client-legacy",
    "http1",
    "http2",
] }
pin-project-lite = "0.2"
# The admin listener's JSON, and nothing else. `/admin/generations` and
# `/admin/routes` serve structures a human and a TUI both read, and hand-rolling
# the escaping for host names and backend names out of a cluster is a way to
# emit invalid JSON on the one input nobody tested. It is off the request path
# entirely: no `serde_json` call happens between accepting a client connection
# and writing its response.
serde_json = "1.0"
# One call, `geteuid`, in the message a refused bind below port 1024 prints.
# This crate forbids unsafe code, so the raw syscall is not an option, and the
# uid is the line that tells the reader why a capability the values file grants
# was not in force. `ramjet-top` already links rustix through crossterm, so the
# workspace pays no new build for it.
rustix = { version = "1.1", features = ["process"] }
socket2 = { version = "0.6", features = ["all"] }
# Comparing the admin bearer token, and nothing else. Six lines of `|= a ^ b`
# would look the same and be a promise this crate cannot keep: nothing stops
# LLVM turning an accumulator loop back into an early exit, and a secret
# comparison that leaks a byte at a time under a timing attack is exactly the
# bug that is invisible in a test. `subtle` exists to hold that guarantee across
# optimiser releases, and rustls already links it, so it costs no build time.
subtle = "2.6"
# One event, on the connection-drop path when a PROXY header is rejected. The
# binary already links this through `ramjet-controller`, and a filtered-out
# event is an atomic load, so the alternative — dropping connections with no
# way to find out why — costs more than the dependency does.
tracing.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "macros",
] }

rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

# HTTP/3, downstream only, and no UDP socket exists unless `--http3` is set.
#
# `quinn` is the QUIC transport, `h3` is RFC 9114 on top of it, and `h3-quinn`
# is the join between the two. Default features are off on quinn for one reason
# that matters and one that does not: `rustls-ring` keeps the crypto provider
# the same as the rest of the workspace — two providers in one binary would
# make *which one signs a handshake* depend on which crate built the config —
# and dropping `platform-verifier` drops a client-side root store this crate
# has no use for, along with its build-time dependencies.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
rcgen.workspace = true
rustls-pemfile.workspace = true
