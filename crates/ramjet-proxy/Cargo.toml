[package]
name = "ramjet-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ramjet-router.workspace = true
arc-swap.workspace = true

bytes = "1.10"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "server-graceful",
    "client",
    "client-legacy",
    "http1",
    "http2",
] }
pin-project-lite = "0.2"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.44", features = [
    "rt",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "macros",
] }

# `ring` rather than `aws-lc-rs`: every crate in this family builds with a
# plain Rust toolchain, and aws-lc-rs wants a C compiler and cmake.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1.11"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

[dev-dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "test-util"] }
rcgen = "0.14"
rustls-pemfile = "2.2"
