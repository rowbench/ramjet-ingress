[package]
name = "ramjet-ingressd"
description = "The ramjet-ingress daemon: watches Kubernetes and serves the compiled route table, or serves a route table from a file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ramjet-ingressd"
path = "src/main.rs"

[dependencies]
ramjet-controller.workspace = true
ramjet-engine.workspace = true
ramjet-proxy.workspace = true
ramjet-router.workspace = true

# Only for `Client::try_default`. Every other Kubernetes type stays behind
# `ramjet-controller`; this binary never handles an API object.
kube.workspace = true

rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
serde = { workspace = true, features = ["derive"] }
# Frozen upstream, but the API is stable and this is the only YAML in the tree:
# it parses the dev-mode `--static-routes` file and nothing else. The
# Kubernetes path builds route tables from API objects, not from YAML on disk.
serde_yaml = "0.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
# The controller logs through `tracing`, and without a subscriber a daemon whose
# job is reacting to a cluster it does not control would react silently.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The global allocator; the `ALLOCATOR` static in main.rs says what it is for
# and what was measured. Default features are right: they include
# `background_threads_runtime_support`, which is the capability. The
# `background_threads` feature would be the wrong way to ask for it — it bakes
# `background_thread:true` into jemalloc's compile-time configuration, and on a
# platform that cannot honour it that is a warning on stderr at every startup.
# `MALLOC_CONF` in main.rs turns it on where it works instead.
tikv-jemallocator = "0.7.0"

[dev-dependencies]
rcgen.workspace = true
