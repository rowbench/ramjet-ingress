[package]
name = "ramjet-ingressd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ramjet-ingressd"
path = "src/main.rs"

[dependencies]
ramjet-proxy.workspace = true
ramjet-router.workspace = true

rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"
serde = { version = "1.0", features = ["derive"] }
# Frozen upstream, but the API is stable and this is the only YAML in the tree:
# it parses the dev-mode `--static-routes` file and nothing else. The
# Kubernetes path builds route tables from API objects, not from YAML on disk.
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal"] }
