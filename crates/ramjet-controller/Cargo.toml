[package]
name = "ramjet-controller"
description = "Kubernetes control plane for ramjet-ingress: watches the API server, compiles Ingress objects into an immutable route table, and publishes it to the data plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ramjet-router.workspace = true

# The compiled artifact this crate exists to produce. Note that `ramjet-router`
# is the *only* ramjet dependency: the controller never sees a socket.
thiserror.workspace = true

# Kubernetes. `default-features` brings in `client` + `rustls-tls` + `ring`,
# which is the TLS stack used to talk to the API server -- not to terminate
# traffic. This crate still holds no rustls types in its public API; see the
# module docs on the layering split.
kube = { workspace = true, features = ["runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }

tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# The audit webhook, and only that. All four are already in the binary through
# `ramjet-proxy`, so this costs a manifest line rather than a build: the control
# plane needed a way to POST one JSON body to an operator-supplied URL, and the
# alternative was hand-writing an HTTP/1.1 request onto a socket. Plaintext
# only, on purpose — see `audit`.
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
futures = "0.3"
tracing.workspace = true
# `DeserializeOwned` appears in the watcher's trait bounds, and the status
# patch is built as a `serde_json::Value`.
serde.workspace = true
serde_json = "1.0"

[dev-dependencies]
# `net` and `io-util` are for the audit webhook test, which stands up a real
# listener and reads the request off the socket rather than trusting that a
# fire-and-forget POST was sent.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
