[package]
name = "ramjet-controller"
description = "Kubernetes control plane for ramjet-ingress: watches the API server, compiles Ingress objects into an immutable route table, and publishes it to the data plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ramjet-router.workspace = true

# The compiled artifact this crate exists to produce. Note that `ramjet-router`
# is the *only* ramjet dependency: the controller never sees a socket.
thiserror.workspace = true

# Kubernetes. `default-features` brings in `client` + `rustls-tls` + `ring`,
# which is the TLS stack used to talk to the API server -- not to terminate
# traffic. This crate still holds no rustls types in its public API; see the
# module docs on the layering split.
kube = { version = "4.2", features = ["runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }

tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
futures = "0.3"
tracing = "0.1"
# `DeserializeOwned` appears in the watcher's trait bounds, and the status
# patch is built as a `serde_json::Value`.
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
