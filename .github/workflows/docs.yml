name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Read the repository, mint the OIDC token deploy-pages exchanges for a
# deployment. Nothing here writes to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled: a half-finished
# Pages deployment is worse than a redundant one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.5.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the mdbook binary
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ env.MDBOOK_VERSION }}-${{ runner.os }}

      - name: Install mdbook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --version ${{ env.MDBOOK_VERSION }} --locked

      - uses: actions/configure-pages@v5

      - name: Build
        run: mdbook build docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
