# The shared upstream. Two containers run this identical config, and the SAME
# pair serves both contenders — so anything this file costs is paid equally by
# ramjet and by nginx, and cancels out of the comparison.
#
# The design goal here is "not the bottleneck". Every setting below exists to
# keep the upstream's own ceiling far above whatever the proxy under test can
# push at it, so the number the benchmark reports is a property of the proxy.

worker_processes auto;          # cpuset-pinned to 2 cores => exactly 2 workers
error_log /dev/stderr error;
pid /tmp/nginx-upstream.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    # No logging tax on the shared upstream, for the same reason the proxies
    # turn it off: a benchmark of disk writes is not a benchmark of HTTP.
    access_log off;

    # A proxy holding a keepalive pool must not have it yanked out from under
    # it. nginx's default keepalive_requests is 1000, which at ~30k rps would
    # force a reconnect storm every fraction of a second and turn the result
    # into a measurement of connection churn. Both proxies would suffer it
    # equally, but it would add variance for no insight, so it is raised out of
    # the way.
    keepalive_requests 100000000;
    keepalive_timeout 300s;

    server {
        # reuseport gives each worker its own accept queue, which removes the
        # accept-mutex thundering herd on a 2-worker upstream.
        listen 8080 default_server reuseport backlog=8192;

        location / {
            default_type text/plain;
            # Served from memory rather than from a file on purpose: a static
            # file adds an open()/stat() per request to the upstream's cost,
            # which lowers the shared ceiling without telling us anything about
            # either proxy. The body is exactly 128 bytes.
            return 200 "ramjet-ingress benchmark upstream payload; fixed-size body so both proxies move identical bytes. 0123456789012345678901234567890";
        }
    }
}
