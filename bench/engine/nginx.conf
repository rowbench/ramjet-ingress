# Contender B: nginx as a reverse proxy, tuned to be a fair fight rather than
# an easy win. Every non-default line below is here for a stated reason; if a
# setting would help nginx, it is on.
#
# The one thing deliberately NOT done is caching. ramjet-ingress has no response
# cache, so turning on proxy_cache would measure nginx serving from memory
# against ramjet talking to an upstream — two different programs doing two
# different jobs. Both contenders forward every request.

worker_processes auto;          # cpuset-pinned to 2 cores => exactly 2 workers
worker_rlimit_nofile 65536;
error_log /dev/stderr error;
pid /tmp/nginx-proxy.pid;

events {
    worker_connections 16384;   # well above c=256 plus the upstream pool
    multi_accept on;            # drain the whole accept queue per wakeup
}

http {
    # No access log. This is the single biggest unforced handicap you can hand
    # nginx in a benchmark: the default config writes a line per request, and
    # ramjet-ingress writes none on the request path. Leaving it on would make
    # the comparison a lie.
    access_log off;

    # Serving-path basics nginx ships on by default; listed explicitly so the
    # tuning is auditable rather than implied.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Client-side keepalive. oha reuses connections, and a 1000-request cap
    # would force it to reconnect mid-run.
    keepalive_timeout 300s;
    keepalive_requests 100000000;

    server_tokens off;

    upstream bench_backends {
        # Literal IPs, not hostnames: ramjet-ingress takes ip:port endpoints
        # (it is fed pod IPs by the controller in production), so giving nginx
        # names would put a DNS lookup in one contender's path and not the
        # other's. Static container IPs keep resolution out of both.
        # Default policy is round-robin, matching the ramjet route table.
        server 172.31.98.11:8080;
        server 172.31.98.12:8080;

        # The upstream keepalive pool — without this nginx opens a fresh TCP
        # connection per request and loses badly for reasons that have nothing
        # to do with its HTTP engine. 64 idle connections PER WORKER (so 128
        # across the 2 workers) against ramjet's 32 idle per endpoint (64
        # total). The edge here is nginx's; see RESULTS.md.
        keepalive 64;
        keepalive_requests 100000000;
        keepalive_timeout 300s;
    }

    server {
        listen 8080 default_server reuseport backlog=8192;
        server_name bench.test;

        location / {
            proxy_pass http://bench_backends;

            # HTTP/1.1 plus a cleared Connection header is the documented
            # requirement for the upstream keepalive pool above to be used at
            # all. Without both lines the `keepalive 64` directive is inert.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Pass the client's Host through, which is what an ingress does and
            # what ramjet-ingress does.
            proxy_set_header Host $host;

            # Buffering on (the default) is nginx at its best for a small fast
            # response: it lets nginx free the upstream connection back to the
            # keepalive pool as soon as the body is read.
            proxy_buffering on;
        }
    }
}
