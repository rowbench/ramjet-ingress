# One host, one path, two endpoints, round-robin — the same shape as
# ../ramjet-routes.yaml, on this benchmark's own subnet so the two harnesses can
# never contend for an address.
#
# Deliberately one rule. A bigger table would measure the router, and
# bench/PROFILE.md already measured the router: the match is 0.1% of a request.

backends:
  - name: bench
    policy: roundRobin
    endpoints:
      - 172.31.98.11:8080
      - 172.31.98.12:8080

routes:
  - host: bench.test
    path: /
    pathType: Prefix
    backend: bench
