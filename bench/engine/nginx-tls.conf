# Contender B for the TLS benchmark: nginx terminating TLS, tuned to be a fair
# fight rather than an easy win.
#
# This is nginx.conf with the listener changed and nothing else weakened. Every
# TLS setting below is one nginx ships on, or one every deployment turns on, and
# leaving any of them off would be handing ramjet a win it did not earn:
#
#   ssl_session_cache      an in-process cache of 10 MB, about 40k sessions.
#                          Off by default, and universally turned on.
#   ssl_session_tickets    on by default in nginx. ramjet's rustls configuration
#                          installs a ticketer for the same reason.
#   ssl_protocols          TLS 1.2 and 1.3, which is what rustls offers here.
#   ssl_session_timeout    long enough that a 30-second run never expires one.
#
# HTTP/2 is deliberately OFF. The uring engine speaks HTTP/1.1, and the whole
# point of the comparison is the same protocol on both sides; letting nginx
# multiplex would measure two different protocols and call it an engine result.

worker_processes auto;          # cpuset-pinned to 2 cores => exactly 2 workers
worker_rlimit_nofile 65536;
error_log /dev/stderr error;
pid /tmp/nginx-proxy.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    # The single biggest unforced handicap in a proxy benchmark; ramjet writes
    # no log on the request path either.
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 300s;
    keepalive_requests 100000000;

    server_tokens off;

    upstream bench_backends {
        server 172.31.98.11:8080;
        server 172.31.98.12:8080;

        keepalive 64;
        keepalive_requests 100000000;
        keepalive_timeout 300s;
    }

    # Shared across workers, not per-worker: a session cached by one worker has
    # to be resumable by the other, or half the resumptions become full
    # handshakes on a two-worker process.
    ssl_session_cache shared:BENCH:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    # nginx's default cipher list is already sensible; stated rather than
    # narrowed, so the negotiation is not steered toward whichever suite
    # happens to be fastest on this machine.
    ssl_prefer_server_ciphers off;

    server {
        # No `http2` directive: HTTP/1.1 on both contenders, by design.
        listen 8443 ssl default_server reuseport backlog=8192;
        server_name bench.test;

        ssl_certificate     /etc/ramjet/certs/cert.pem;
        ssl_certificate_key /etc/ramjet/certs/key.pem;

        location / {
            proxy_pass http://bench_backends;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering on;
        }
    }
}
