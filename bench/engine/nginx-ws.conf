# Contender B for the WebSocket tunnel benchmark.
#
# nginx.conf with the four lines a WebSocket proxy needs and nothing else
# changed. Those four are not a tuning choice — without them nginx strips
# `Upgrade` as hop-by-hop, the origin answers 200, and there is no tunnel to
# measure.
#
# There is no upstream keepalive pool here, and there cannot be: an upgraded
# connection is not returned to a pool by anyone, because after a 101 it is not
# HTTP any more. That is true of all three contenders, which is why leaving it
# out is fairness rather than a handicap.

worker_processes auto;
worker_rlimit_nofile 65536;
error_log /dev/stderr error;
pid /tmp/nginx-proxy.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server_tokens off;

    # An idle WebSocket is a working WebSocket, so the read timeout has to be
    # long enough that a quiet tunnel is not closed underneath the measurement.
    # ramjet puts a tunnel on no clock at all; this is nginx's nearest
    # equivalent.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ws_backends {
        server 172.31.98.11:9001;
        server 172.31.98.12:9001;
    }

    server {
        listen 8080 default_server reuseport backlog=8192;
        server_name bench.test;

        location / {
            proxy_pass http://ws_backends;

            # The four that make an upgrade cross the hop.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # Off: buffering a stream that has no end is not something to do to
            # a tunnel, and nginx ignores it after a 101 anyway. Stated so the
            # configuration is auditable rather than implied.
            proxy_buffering off;
        }
    }
}
