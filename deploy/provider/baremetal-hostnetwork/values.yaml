# Bare metal — a DaemonSet on the host network, serving :80 and :443 directly.
#
#   helm install ramjet deploy/chart/ramjet-ingress \
#     --namespace ramjet-ingress --create-namespace \
#     -f deploy/provider/baremetal-hostnetwork/values.yaml
#
# This is the chart's default shape, so the same install with no -f at all gets
# it. The file is kept, and kept explicit, for two reasons: it is what
# deploy/static/provider/baremetal-hostnetwork.yaml is rendered from, and a
# preset that inherited its whole meaning from the defaults would change
# silently the next time those moved.
#
# No NodePort translation and no balancer: the listeners bind the node's own
# interfaces, so a client reaching any node on :80 reaches this directly and
# the source address on the socket is the client's. That is the whole appeal,
# and it is the only shape here that gets the real client address on bare metal
# without something in front prepending a PROXY header.
#
# What it costs:
#
#  * The ports belong to the node. A second copy on the same node cannot bind
#    them, which is why this is a DaemonSet — exactly one per node — and why
#    anything else already holding :80 (another ingress controller, a host
#    process) makes the pod crash-loop with a bind error rather than anything
#    Kubernetes reports as a scheduling failure.
#
#  * The admin port is on the host too, on every node. It carries /metrics and
#    the probes and is not a thing to leave reachable from outside; the node
#    firewall is now the only thing keeping :10254 private.
#
#  * Ingress status has nothing to read. There is no LoadBalancer Service, so
#    set controller.publishAddress to the address clients actually use — the
#    VIP, the DNS name, whatever fronts the nodes.
#
# For a cluster that wants a real address rather than a set of node IPs, put
# MetalLB in front instead and use the generic install with
# service.type=LoadBalancer: MetalLB assigns an address out of an IPAddressPool
# and the Service behaves like a cloud one, status writeback included.
#   https://metallb.universe.tf/

kind: DaemonSet
hostNetwork: true

ports:
  http: 80
  https: 443

# Deliberately no securityContext block here — the chart's default already is
# this one, NET_BIND_SERVICE included.
#
# There used to be a copy of it in this file, and the copy is what made the
# fault look like a preset problem: the pod crash-looped on a stock node with
# "Permission denied (os error 13)" binding :80, because Kubernetes puts an
# added capability in the container's permitted set and a non-root process drops
# it again on execve. Nothing in a values file can fix that; only a file
# capability on the binary raises one into a non-root effective set, and the
# image now carries `setcap cap_net_bind_service=+ep`. The chart's
# `securityContext` note has the rest, including why the capability has to stay
# in the bounding set even on ports above 1024.

service:
  # A ClusterIP Service, kept only so in-cluster clients have a name to resolve
  # and so the chart's own objects stay consistent. External traffic does not
  # go through it — it arrives at the node ports directly — and a NodePort or
  # LoadBalancer here would allocate ports nothing would ever use.
  type: ClusterIP

# Nothing to read an address from; see the note above.
controller:
  publishAddress: ""
