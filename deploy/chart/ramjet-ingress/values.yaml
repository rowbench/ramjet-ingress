# Default configuration for ramjet-ingress.

image:
  repository: ramjet-ingress
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Not a value, and that is the point.
#
# There is no leader election yet. Ingress status writeback is a read of a
# Service's address followed by a server-side-apply patch of every managed
# Ingress, and every replica would do it — with the same field manager, against
# the same objects, on its own debounce schedule. Two replicas do not corrupt
# the status, but they do write it in a loop, and the resulting patch traffic
# scales with replica count times Ingress count against the API server.
#
# The template hard-codes `replicas: 1`. Raising it is a code change (leader
# election in the controller), not a values change, and leaving the knob here
# for someone to find at 3am would be an invitation to a bad night.

nameOverride: ""
fullnameOverride: ""

# Deployment or DaemonSet.
#
# Deployment is right nearly everywhere: the pod sits behind a Service and the
# cloud load balancer reaches it through that Service's endpoints, wherever the
# scheduler happened to put it. DaemonSet is for the cases where being *on* a
# node is what makes the pod reachable at all — hostNetwork binding node ports
# directly, or a provider whose load balancer targets every node.
#
# The cost of DaemonSet, stated plainly rather than discovered: every pod runs
# its own status writer, because there is no leader election. N pods do not
# corrupt an Ingress status — they write the same address through the same
# field manager, so the patches converge — but they each write it on their own
# debounce, and the resulting API traffic is nodes x Ingresses. Where that
# matters more than a populated status field, set controller.updateStatus=false
# and let the address be whatever the cluster's DNS says it is.
kind: Deployment

controller:
  # IngressClass this replica answers to. An Ingress naming any other class is
  # invisible to it, which is what makes running alongside ingress-nginx during
  # a migration safe.
  ingressClass: ramjet

  # A single namespace to watch, or "" for the whole cluster. Narrowing this
  # does not narrow the RBAC below — see rbac.create.
  watchNamespace: ""

  # Write .status.loadBalancer on managed Ingresses.
  updateStatus: true

  # Where that status points. `publishService` names a Service whose own
  # .status.loadBalancer supplies the address, and defaults to this chart's own
  # LoadBalancer Service — which is the whole mechanism by which an Ingress in
  # some other namespace learns the address traffic actually arrives on.
  # `publishAddress` is the literal fallback used when that Service has no
  # address yet (or is not a LoadBalancer at all).
  publishService: ""     # defaults to "<release-namespace>/<fullname>"
  publishAddress: ""

  # Backend for requests matching no rule, as namespace/name:port. Empty means
  # unmatched requests get a 404 from the proxy itself.
  defaultBackend: ""

  # Secret (namespace/name) answering a handshake whose SNI matches nothing.
  defaultTlsSecret: ""

  # Upstream behaviour. Seconds.
  connectTimeout: 5
  responseTimeout: 60
  maxConnectAttempts: 3

  # How long in-flight requests get after SIGTERM. Kept below
  # terminationGracePeriodSeconds so the drain finishes before the kill.
  shutdownGrace: 30

  # Compiled generations kept in memory for /admin/generations and for
  # POST /admin/rollback, which republishes one of them instantly.
  #
  # Each kept generation holds its route table and its parsed certificates
  # alive — roughly a hundred bytes per route, with certificates shared between
  # generations that did not rotate them — so ten of a ten-thousand route
  # cluster is a few megabytes. Raise it where deploys are frequent enough that
  # ten is less than an afternoon.
  #
  # A rollback is an emergency brake and not desired state: it lives in one
  # replica's memory and does not survive a restart, because after a restart
  # Kubernetes is the source of truth again.
  historySize: 10

  # POST the semantic diff of every published generation to this URL.
  #
  # Fire-and-forget: one attempt, a 5s timeout, failures logged and never
  # blocking a publish — the same record is already in the log, in a Kubernetes
  # Event, and in /admin/generations, so a delivery system with retries and
  # backoff would be a thing to debug during exactly the incidents this exists
  # to describe.
  #
  # http:// only. An https:// URL is refused at startup rather than downgraded,
  # because the control plane deliberately carries no TLS client for this;
  # point it at a collector inside the cluster.
  auditWebhook: ""

  # Anything not covered above. Appended verbatim after the generated flags,
  # and a flag always beats its environment twin.
  extraArgs: []

  # RUST_LOG. `info` for the controller's own events, `warn` for the noisier
  # kube-rs internals.
  logLevel: "info,kube=warn"

  extraEnv: []

# Expect a PROXY protocol header ahead of every connection on the http and
# https listeners, and take the client address from it instead of from the
# socket.
#
# This is a property of the listener, not of a connection: once it is on, a
# connection arriving without the header is rejected. Turn it on only where
# *every* route to those ports passes through something that prepends one,
# which is why each provider preset that sets this also sets the load balancer
# annotation that makes the header appear — the two are a pair, and changing
# one without the other breaks the port in one direction or the other.
#
# The admin listener is deliberately never covered: /healthz and /readyz come
# from the kubelet, which speaks no PROXY protocol and would be rejected.
proxyProtocol:
  enabled: false

# HTTP/3 over QUIC, on the same port number as https but in UDP.
#
# EXPERIMENTAL, and off. Turning it on adds --http3, a UDP containerPort and a
# UDP Service port, and makes every HTTPS response carry
# `alt-svc: h3=":<port>"; ma=86400` — which is a client's only way to learn the
# QUIC port exists.
#
# The advertisement names the port clients already use for TCP, so that exact
# port number has to be reachable over UDP too, all the way through whatever
# fronts this Service. That is the part that is not a values change:
#
#   - AWS NLB forwards UDP, and is the shape this was built against: one
#     Service can carry TCP 443 and UDP 443 on one balancer.
#   - GCP, Azure and most other managed L4 load balancers either do not forward
#     UDP at all or need a second balancer for it — and two balancers do not
#     share an address, so the advertisement would name a port the client
#     cannot reach.
#   - hostNetwork on bare metal works, because there is no balancer to ask: the
#     node's UDP 443 is the node's UDP 443.
#
# A client whose QUIC attempt fails falls back to TCP on its own, so getting
# this wrong is slow rather than broken — one wasted attempt per connection
# until the advertisement expires. deploy/README.md has the detail.
#
# It also requires ports.https, because the QUIC listener takes that port
# number and the alt-svc header rides on that listener's responses. The daemon
# refuses the combination at startup rather than binding a UDP port that
# nothing advertises.
http3:
  enabled: false

ports:
  http: 8080
  # The TLS listener, or 0 to have none at all. Zero is what you want when
  # something in front terminates TLS and forwards plaintext — see the
  # aws-nlb-tls preset. The container port goes away with it and the daemon
  # gets --no-https, so nothing is listening, rather than something listening
  # with no certificate to offer.
  https: 8443
  admin: 10254

service:
  # LoadBalancer is the default because publishService above needs an address
  # to publish. On a cluster with no load balancer controller the Service stays
  # pending, the status falls back to publishAddress, and routing is unaffected.
  type: LoadBalancer
  annotations: {}
  labels: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  # Cluster (the Kubernetes default when unset) lets any node accept the packet
  # and forward it on, which SNATs the client address away. Local keeps it, at
  # the price of only nodes running a ready pod being valid targets — which is
  # exactly what the healthCheckNodePort Kubernetes allocates alongside it
  # tells the load balancer. Every cloud preset here sets Local; see
  # deploy/README.md for when that is a trap rather than a win.
  externalTrafficPolicy: ""
  http:
    port: 80
    nodePort: ""
    # Which container port this Service port forwards to, by name. Repointing
    # it is how the terminate-TLS-at-the-load-balancer shape is expressed:
    # aim 443 at `http` and the balancer's plaintext output lands on the
    # plaintext listener.
    targetPort: http
  https:
    port: 443
    nodePort: ""
    targetPort: https

# The admin port lives on its own ClusterIP Service, never on the LoadBalancer.
# /metrics and the probes are not things to expose to the internet by accident,
# and putting them on a separate object means the split is structural rather
# than a matter of remembering to omit a port.
adminService:
  enabled: true
  port: 10254
  annotations: {}
  labels: {}

ingressClass:
  # The IngressClass object naming this controller. Cluster-scoped: disable it
  # when a second release would collide on the same name.
  create: true
  name: ""           # defaults to controller.ingressClass
  # Make this the class for Ingresses that name none. At most one IngressClass
  # in a cluster may say true.
  isDefaultClass: false

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  # The exact permissions the controller's five watches and its status writer
  # need — no more. Cluster-scoped even when controller.watchNamespace is set,
  # because IngressClass is a cluster-scoped resource and the class filter can
  # not be evaluated without reading it.
  create: true

# Kubernetes-mode readiness is not "the process started": it is "a route table
# has been compiled and published". Until the first generation lands, /readyz
# is 503 and this replica stays out of the Service, because an empty table
# would 404 every request it received.
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    # No CPU limit on purpose: throttling a proxy's event loop shows up as
    # latency on every request through it, and the request above is what the
    # scheduler actually uses. Memory is limited because the failure mode of a
    # leak is taking the node down with it.
    #
    # What this number buys, measured rather than guessed: an idle keep-alive
    # connection costs about 20 KiB, so 256Mi is roughly twelve thousand of
    # them. bench/thesis/RESULTS.md's benchmark 4 held 10,000 and peaked at
    # 200.7 MiB. Size this by the connections a replica will hold, not by the
    # traffic through it — the request path streams and does not buffer bodies.
    memory: 256Mi

# Longer than controller.shutdownGrace, so the drain is what ends the process.
terminationGracePeriodSeconds: 45

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# Bind the listeners on the node's own interfaces rather than in a pod network
# namespace. This is what lets ports.http be 80 and ports.https be 443 with no
# NodePort translation in between, and it is the only shape on bare metal that
# preserves the client address without a load balancer in front.
#
# What it costs: the ports are the node's, so a second pod on the same node
# cannot bind them and will sit in CrashLoopBackOff — pair this with
# kind: DaemonSet, which gives exactly one per node. Anything else already on
# the node's :80 (another ingress controller, a stray host process) collides
# the same way, and the error is a bind failure in the log rather than
# anything Kubernetes reports as a scheduling problem.
hostNetwork: false

# Left empty, the template picks ClusterFirstWithHostNet whenever hostNetwork
# is on and ClusterFirst otherwise. That default is not cosmetic: a
# host-network pod keeps the *node's* resolv.conf under the normal policy, and
# a controller that cannot resolve a cluster-local Service name is a subtle
# outage rather than an obvious one.
dnsPolicy: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# A ServiceMonitor is deliberately absent: it would make the chart depend on
# the Prometheus operator's CRDs being installed. The admin Service carries the
# scrape annotations instead, which the annotation-based discovery every
# Prometheus ships with already understands.
metrics:
  scrapeAnnotations: true
