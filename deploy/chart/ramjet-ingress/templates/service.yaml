{{/*
The traffic Service: plaintext and TLS only. The admin port is deliberately not
here — see admin-service.yaml.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ramjet-ingress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ramjet-ingress.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: {{ .Values.service.http.targetPort }}
      protocol: TCP
      {{- if and .Values.service.http.nodePort (ne (toString .Values.service.type) "ClusterIP") }}
      nodePort: {{ .Values.service.http.nodePort }}
      {{- end }}
    - name: https
      port: {{ .Values.service.https.port }}
      # Usually the TLS listener, but not always: where the load balancer
      # terminates TLS this points at `http`, and the port named https here
      # carries plaintext that was HTTPS one hop ago. The name is the Service
      # port's, and Service port names are what provider annotations like
      # aws-load-balancer-ssl-ports select on, so it stays `https` either way.
      targetPort: {{ .Values.service.https.targetPort }}
      protocol: TCP
      {{- if and .Values.service.https.nodePort (ne (toString .Values.service.type) "ClusterIP") }}
      nodePort: {{ .Values.service.https.nodePort }}
      {{- end }}
    {{- if .Values.http3.enabled }}
    # HTTP/3, on the same port number as https and in UDP. A Service may carry
    # two ports with the same number when their protocols differ, and it has to
    # here: the alt-svc header advertises the port clients already use for TCP,
    # so a different number would be advertising something no client would
    # reach. Whether the load balancer in front actually forwards UDP is a
    # per-provider question — see deploy/README.md.
    - name: https-quic
      port: {{ .Values.service.https.port }}
      # Always the QUIC container port, never service.https.targetPort:
      # repointing that one at `http` is how "the load balancer terminates TLS"
      # is expressed, and there is no such thing as QUIC to a plaintext port.
      targetPort: https-quic
      protocol: UDP
      # No nodePort. Whether a Service may reuse one across protocols is a
      # question different Kubernetes versions answer differently, and a
      # rejected Service is a worse outcome than an allocated UDP nodePort
      # nobody addresses directly — LoadBalancer traffic arrives on `port`,
      # which is the number alt-svc advertises and the one that has to match.
    {{- end }}
  selector:
    {{- include "ramjet-ingress.selectorLabels" . | nindent 4 }}
