{{/*
The traffic Service: plaintext and TLS only. The admin port is deliberately not
here — see admin-service.yaml.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ramjet-ingress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ramjet-ingress.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: {{ .Values.service.http.targetPort }}
      protocol: TCP
      {{- if and .Values.service.http.nodePort (ne (toString .Values.service.type) "ClusterIP") }}
      nodePort: {{ .Values.service.http.nodePort }}
      {{- end }}
    - name: https
      port: {{ .Values.service.https.port }}
      # Usually the TLS listener, but not always: where the load balancer
      # terminates TLS this points at `http`, and the port named https here
      # carries plaintext that was HTTPS one hop ago. The name is the Service
      # port's, and Service port names are what provider annotations like
      # aws-load-balancer-ssl-ports select on, so it stays `https` either way.
      targetPort: {{ .Values.service.https.targetPort }}
      protocol: TCP
      {{- if and .Values.service.https.nodePort (ne (toString .Values.service.type) "ClusterIP") }}
      nodePort: {{ .Values.service.https.nodePort }}
      {{- end }}
  selector:
    {{- include "ramjet-ingress.selectorLabels" . | nindent 4 }}
