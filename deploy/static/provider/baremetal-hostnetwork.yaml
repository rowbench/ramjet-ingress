apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ramjet-ramjet-ingress
  namespace: ramjet-ingress
  labels:
    helm.sh/chart: ramjet-ingress-0.1.0
    app.kubernetes.io/name: ramjet-ingress
    app.kubernetes.io/instance: ramjet
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
spec:
  # A DaemonSet has no replica count to hard-code: the node set is the replica
  # count, and one status writer per node is the price of being on every node.
  # RollingUpdate one at a time because on hostNetwork the old pod must release
  # the node's :80 before the new one can take it.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ramjet-ingress
      app.kubernetes.io/instance: ramjet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramjet-ingress
        app.kubernetes.io/instance: ramjet
    spec:
      serviceAccountName: ramjet-ramjet-ingress
      hostNetwork: true
      # An explicit dnsPolicy wins; otherwise hostNetwork decides it. A
      # host-network pod under plain ClusterFirst inherits the *node's*
      # resolv.conf and cannot resolve a cluster Service, so leaving this to
      # chance would make the controller's API access depend on how the node
      # happens to be configured.
      dnsPolicy: ClusterFirstWithHostNet
      # Longer than controller.shutdownGrace, so the process ends by finishing
      # its drain rather than by being killed part-way through one.
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "ramjet-ingress:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --http=:80
            - --https=:443
            - --admin=:10254
            - --ingress-class=ramjet
            - --publish-service=ramjet-ingress/ramjet-ramjet-ingress
            - --connect-timeout=5
            - --response-timeout=60
            - --max-connect-attempts=3
            - --shutdown-grace=30
            - --history-size=10
          env:
            - name: RUST_LOG
              value: "info,kube=warn"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # No hostPort even under hostNetwork: the API server defaults hostPort
          # to containerPort for a host-network pod, and the scheduler's port
          # conflict check reads it from there. Writing it out again would only
          # be a second place to keep in sync.
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: admin
              containerPort: 10254
              protocol: TCP
          # /healthz answers whenever the process is answering; /readyz waits
          # for a compiled route table. Restarting on the former and gating
          # traffic on the latter is the whole distinction: a replica that has
          # not finished its first list should be kept out of the Service, not
          # killed and made to start over.
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            failureThreshold: 3
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - NET_BIND_SERVICE
              drop:
              - ALL
            readOnlyRootFilesystem: true
